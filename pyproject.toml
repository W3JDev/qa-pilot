[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qa-pilot"
version = "0.1.0"
description = "Agentic QA platform — autonomous browser-driven test team for any web app"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "W3JDev", email = "mnjewelps@gmail.com" }]
keywords = ["qa", "testing", "playwright", "ai-agents", "browser-automation", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "playwright>=1.49",
    "litellm>=1.55",
    "pydantic>=2.9",
    "typer>=0.15",
    "pyyaml>=6.0",
    "rich>=13.9",
    "httpx>=0.28",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]
github = ["PyGithub>=2.5"]
slack = ["slack-sdk>=3.33"]
telegram = ["python-telegram-bot>=21.7"]

[project.scripts]
qa-pilot = "qa_pilot.cli:app"

[project.urls]
Homepage = "https://github.com/W3JDev/qa-pilot"
Issues = "https://github.com/W3JDev/qa-pilot/issues"
Repository = "https://github.com/W3JDev/qa-pilot.git"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_pilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
