name: QA Pilot — PR check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL to test (defaults to staging)"
        required: false
        default: "https://staging.example.com"

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: write   # to post PR comments
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install qa-pilot
        run: |
          pip install --upgrade pip
          pip install -e .[github]
          python -m playwright install chromium --with-deps

      - name: Pick target URL
        id: target
        run: |
          if [ -n "${{ inputs.target_url }}" ]; then
            echo "url=${{ inputs.target_url }}" >> $GITHUB_OUTPUT
          else
            # Default — read from a repo variable, or fall back
            echo "url=${{ vars.QA_PILOT_TARGET_URL || 'https://example.com' }}" >> $GITHUB_OUTPUT
          fi

      - name: Run QA team
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Build a config on the fly; users can also commit a real one.
          cat > /tmp/qa.yaml <<EOF
          target_url: ${{ steps.target.outputs.url }}
          viewports:
            - { width: 1440, height: 900, name: desktop }
            - { width: 390,  height: 844, name: mobile }
          agents: [vega_smoke, iris_visual, sage_aesthetic]
          report:
            formats: [markdown]
            destinations:
              - { type: file, path: ./qa-report.md }
              - { type: github_pr_comment }
          llm_model: gpt-4o-mini
          EOF
          qa-pilot run /tmp/qa.yaml --verbose

      - name: Upload report + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-pilot-report
          path: |
            qa-report.md
            qa-artifacts/
          retention-days: 14
